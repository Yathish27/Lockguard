# Free, no-billing deploy: builds the static UI and deploys it to Firebase Hosting only.
# Scanning is disabled in this build (no backend); the UI shows how to run scans locally.
# Keyless auth via Workload Identity Federation — run scripts/setup-github-deploy.sh once first.
name: hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  hosting:
    runs-on: ubuntu-latest
    env:
      PROJECT: lockguard-9b9b2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: lockguard-9b9b2
          workload_identity_provider: projects/356135058855/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: lockguard-deployer@lockguard-9b9b2.iam.gserviceaccount.com
      - name: Deploy UI to Firebase Hosting (static, no backend)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: npx firebase-tools@latest deploy --only hosting --config firebase.hosting-only.json --project "$PROJECT" --non-interactive
