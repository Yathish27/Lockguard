# Push-to-deploy to Firebase Hosting using a CI token (no service account, no gcloud, no org-policy changes).
# One-time: run `firebase login:ci` locally, then add the printed token as the repo secret FIREBASE_TOKEN.
name: deploy-hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx firebase-tools@13 deploy --only hosting --project lockguard-9b9b2 --non-interactive
